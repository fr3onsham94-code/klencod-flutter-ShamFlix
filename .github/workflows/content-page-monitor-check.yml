name: Check ShamFlix content page monitors

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/movie-auto-monitor/**'
      - 'supabase/functions/series-auto-monitor/**'
      - '.github/workflows/content-page-monitor-check.yml'

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check movie monitor
        run: deno check supabase/functions/movie-auto-monitor/index.ts
      - name: Type-check series monitor
        run: deno check supabase/functions/series-auto-monitor/index.ts
