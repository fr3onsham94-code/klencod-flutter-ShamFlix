name: ShamFlix Experimental APK

on:
  push:
    branches:
      - feat/experimental-3-background-import-admin

permissions:
  contents: read

jobs:
  build-experimental:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build installable experimental APK
        env:
          SHAMFLIX_EXPERIMENTAL_BUILD: "true"
        run: flutter build apk --debug

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: ShamFlix-Experimental-3
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
