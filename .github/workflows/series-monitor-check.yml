name: Series monitor Edge Function check

on:
  pull_request:
    paths:
      - "supabase/functions/series-auto-monitor/**"
      - ".github/workflows/series-monitor-check.yml"
  push:
    branches:
      - "fix/series-monitor-bounded-discovery"
    paths:
      - "supabase/functions/series-auto-monitor/**"
      - ".github/workflows/series-monitor-check.yml"

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check series monitor
        run: deno check supabase/functions/series-auto-monitor/index.ts
