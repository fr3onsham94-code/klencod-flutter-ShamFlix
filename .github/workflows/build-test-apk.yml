name: Build ShamFlix test APK
# Test branch APK build: verify the owner dashboard changes before merge.

on:
  push:
    branches:
      - main
      - feature/auto-tv-channel-aggregation
      - fix/shared-app-settings-notifier
      - ui/collapsible-admin-settings-packages
      - feature/supabase-usage-dashboard
      - feature/channel-playback-headers
      - test/bulk-website-channel-import
      - experimental/website-crawler-player-welcome
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build isolated trial APK
        env:
          SHAMFLIX_TRIAL_BUILD: 'true'
        run: flutter build apk --debug --no-pub --dart-define=SHAMFLIX_TRIAL_MODE=true

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ShamFlix-trial-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
